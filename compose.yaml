services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: daily_quest
      POSTGRES_PASSWORD: daily_quest
      POSTGRES_DB: daily_quest
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - daily_quest_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daily_quest"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  daily_quest_data:
